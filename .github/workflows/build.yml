name: Build TrollMask (deb)

# 自动构建：push / PR / 手动触发后，在 macOS runner 上手动安装 Theos + iOS 16.5 SDK，
# 编译注入 dylib 与主 App，并打包成 deb 作为 Artifact 产出。
# （不依赖第三方 setup-theos action，避免仓库失效导致流水线整体失败。）
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .deb on macOS
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew build deps
        # theos 打包需要 ldid(伪签) / dpkg(打 deb)
        run: |
          brew update || true
          brew install make ldid dpkg fakeroot
          echo "ldid -> $(command -v ldid)"
          echo "dpkg -> $(command -v dpkg)"
          echo "swift -> $(command -v swift)"

      - name: Set up Theos + iOS SDK 16.5 (manual)
        run: |
          set -e
          echo "==> 克隆 theos"
          git clone --recursive https://github.com/theos/theos "$THEOS"
          echo "==> 下载 theos/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          rm -rf /tmp/sdks_extract && mkdir -p /tmp/sdks_extract
          unzip -q -o /tmp/sdks.zip -d /tmp/sdks_extract
          mkdir -p "$THEOS/sdks"
          mv /tmp/sdks_extract/sdks-master/*.sdk "$THEOS/sdks/"
          echo "==> 可用 SDK:"
          ls "$THEOS/sdks"

      - name: Build dylib + app and package .deb
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMask-deb
          path: |
            packages/*.deb
            .theos/*.deb
          if-no-files-found: error
