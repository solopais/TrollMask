name: Build TrollMask (IPA)

# 自动构建：push / PR / 手动触发后，在 macOS runner 上：
#   - 用 Theos 编译注入 dylib（ObjC tweak，Theos 支持良好）
#   - 用 xcodegen + xcodebuild 编译 SwiftUI 主 App（避免 Theos application.mk 对 Swift 的静默跳过）
#   - 用 ldid 把 entitlements 签进二进制
#   - 打包成可直接用 TrollStore 安装的 IPA 作为 Artifact 产出
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA on macOS
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew build deps
        # xcodegen 生成 Xcode 工程；ldid 把 entitlements 签进二进制；theos/dpkg 备用
        run: |
          brew update || true
          brew install xcodegen ldid dpkg make
          echo "xcodegen -> $(command -v xcodegen)"
          echo "ldid -> $(command -v ldid)"
          echo "xcodebuild -> $(command -v xcodebuild)"
          echo "swift -> $(command -v swift)"
          xcodebuild -version

      - name: Set up Theos + iOS SDK (use runner's Xcode SDK, 避免 theos/sdks 被限流 429)
        run: |
          set -e
          echo "==> 克隆 theos"
          git clone --recursive https://github.com/theos/theos "$THEOS"
          echo "==> 复用 runner 自带的 Xcode iPhoneOS SDK（runner 已装完整 Xcode + iPhoneOS SDK）"
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "    Xcode SDK: $XCODE_SDK"
          mkdir -p "$THEOS/sdks"
          # Theos 按目录名匹配 SDK 版本；dylib 的 TARGET 为 iphone:clang:16.5，
          # 故把 Xcode 的 iPhoneOS SDK 软链成 iPhoneOS16.5.sdk 以匹配，无需联网下载 theos/sdks。
          ln -sfn "$XCODE_SDK" "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "==> 可用 SDK:"
          ls -la "$THEOS/sdks"

      - name: Build dylib (Theos) + App (xcodebuild) -> IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollMask-ipa
          path: |
            *.ipa
            *.tipa
          if-no-files-found: error

